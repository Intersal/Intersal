<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Gallery // 陰茎</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

  <nav>
      <a href="../../Media/index.html">COLLECTION //</a>
  </nav>

  <div class="page">
    <header>
      <div>
        <h1 class="headermainname">Laugh Gallery</h1>
      </div>
      <div class="header-meta">
          陰茎 // FILE_LOADER
      </div>
    </header>

    <main id="gallery" class="gallery" aria-live="polite"></main>

    <div class="note">
      <strong>NOTICE //</strong> Images are loaded through shitty JavaScript. I just thought this was of note.
    </div>
  </div>

  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Fullscreen preview">
  </div>

  <script>
    const imageFiles = [
      "THOSE WHO KNOW  AHAHHAHAHAHAH.png",
      "do i look like troll face.jpg",
      "mist or beast.jpg",
      "secretsecient.png",
      "smirk kid.png"
    ];

    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    if (imageFiles.length === 0) {
      gallery.innerHTML = '<p style="color:#666666; text-align:center; width:100%;">No assets loaded in catalog layout index.</p>';
    } else {
      imageFiles.forEach((file, index) => {
        const card = document.createElement('article');
        card.className = 'card';
        const paddedIndex = String(index + 1).padStart(2, '0');
        const indexSpan = document.createElement('span');
        indexSpan.className = 'card-index';
        indexSpan.textContent = `${paddedIndex} // MEDIA`;

        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.textContent = file.replace(/\.[^.]+$/, ''); 

        const img = document.createElement('img');
        img.src = encodeURI(file);
        img.alt = file.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
        img.loading = 'fuckthisshit';
        img.title = 'If you click on it it will show you the full image without it being cut off.';

        // I FUCKING HATE JAVASCRIPT I HOPE JOHN JAVASCRIPT FUCKING DIES
        img.addEventListener('click', () => {
          lightboxImg.src = img.src;
          lightbox.style.display = 'flex';
        });

        card.appendChild(indexSpan);
        card.appendChild(caption);
        card.appendChild(img);
        gallery.appendChild(card);
      });
    }

    function closeLightbox() {
      lightbox.style.display = 'none';
      lightboxImg.src = '';
    }
  </script>
</body>
</html>
